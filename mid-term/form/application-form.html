<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header><h1>Application Form</h1></header>

    <form>
        <label for="fName">First Name</label>
        <input type="text" id="fName">

        <label for="lName">Last Name</label>
        <input type="text" id="lName"> <br><br>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob">

        <label for="age">Age</label>
        <input type="number" id="age"> <br><br>

        <label for="gender">Gender</label>
        <select id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <label for="email">Email Address: </label>
        <input type="email" placeholder="example@email.com"> <br> <br>

        <label for="positions">Positions Available: </label>
        <input type="radio" name="selected_pos" id="juniorDev" value="Junior Developer">
        <label for="juniorDev">Junior Develeoper</label>
        <input type="radio" name="selected_pos" id="midDev" value="Mid-Level Developer">
        <label for="midDev">Mid-Level Develeoper</label>
        <input type="radio" name="selected_pos" id="seniorDev" value="Senior Developer">
        <label for="juniorDeveloper">Senior Develeoper</label> <br><br>

        <label for="pl">Programming Languages: </label>
        <input type="checkbox" value="java" id="java">
        <label for="java">Java</label>
        <input type="checkbox" value="javascript" id="javascript">
        <label for="javascript">JavaScript</label>
        <input type="checkbox" value="pyton" id="python">
        <label for="python">Python</label> <br><br>

        <label for="password">Password</label>
        <input type="password">

        <label for="confirmPassword">Confirm Password</label>
        <input type="password"> <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    


    </form>
    
</body>
</html>
