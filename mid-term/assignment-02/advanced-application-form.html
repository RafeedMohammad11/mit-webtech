<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Job Application Form</title>
</head>
<body>
    <header>
        <h1>Advanced Job Application Form</h1>
    </header>

    <form>
        <!-- Personal Information Section -->
        <section>
            <h2>Personal Information</h2>
            <table cellpadding="5" cellspacing="0" border="0">
                <tr>
                    <td><label for="fullName">Full Name *</label></td>
                    <td><input type="text" id="fullName" name="fullName" required></td>
                </tr>
                <tr>
                    <td><label for="dob">Date of Birth *</label></td>
                    <td><input type="date" id="dob" name="dob" required></td>
                </tr>
                <tr>
                    <td><label for="age">Age *</label></td>
                    <td><input type="number" id="age" name="age" min="0" max="100" required></td>
                </tr>
                <tr>
                    <td><label for="gender">Gender *</label></td>
                    <td><select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select></td>
                </tr>
                <tr>
                    <td><label for="nationality">Nationality *</label></td>
                    <td><input type="text" id="nationality" name="nationality" required></td>
                </tr>
                <tr>
                    <td><label for="profilePicture">Profile Picture *</label></td>
                    <td><input type="file" id="profilePicture" name="profilePicture" accept="image/*" required></td>
                </tr>
            </table>
        </section>
        <hr>

        <!-- Contact Information Section -->
        <section>
            <h2>Contact Information</h2>
            <table cellpadding="5" cellspacing="0" border="0">
                <tr>
                    <td><label for="email">Email Address *</label></td>
                    <td><input type="email" id="email" name="email" placeholder="example@email.com" required></td>
                </tr>
                <tr>
                    <td><label for="phone">Phone Number *</label></td>
                    <td><input type="tel" id="phone" name="phone" placeholder="+1234567890" required></td>
                </tr>
                <tr>
                    <td><label for="address">Present Address *</label></td>
                    <td><textarea id="address" name="address" rows="3" required></textarea></td>
                </tr>
            </table>
        </section>
        <hr>

        <!-- Job Information Section -->
        <section>
            <h2>Job Information</h2>
            
            <label>Position Applied For *</label> <br>
            <input type="radio" id="juniorDev" name="position" value="Junior Developer" required>
            <label for="juniorDev">Junior Developer</label> <br>
            <input type="radio" id="midDev" name="position" value="Mid-Level Developer" required>
            <label for="midDev">Mid-Level Developer</label> <br>
            <input type="radio" id="seniorDev" name="position" value="Senior Developer" required>
            <label for="seniorDev">Senior Developer</label> <br>

            <label for="salary">Expected Salary *</label>
            <input type="number" id="salary" name="salary" min="0" required> <br>

            <label for="experience">Years of Experience *</label>
            <input type="number" id="experience" name="experience" min="0" max="80" required> <br>

            <label for="joiningDate">Available Joining Date *</label>
            <input type="date" id="joiningDate" name="joiningDate" required> <br>
        </section>
        <hr>

        <!-- Technical Skills Section -->
        <section>
            <h2>Technical Skills</h2>
            
            <label>Select Your Skills *</label> <br>
            <input type="checkbox" id="html" name="skills" value="HTML" required>
            <label for="html">HTML</label> <br>
            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label> <br>
            <input type="checkbox" id="javascript" name="skills" value="JavaScript">
            <label for="javascript">JavaScript</label> <br>
            <input type="checkbox" id="python" name="skills" value="Python">
            <label for="python">Python</label> <br>
            <input type="checkbox" id="java" name="skills" value="Java">
            <label for="java">Java</label> <br>
            <input type="checkbox" id="php" name="skills" value="PHP">
            <label for="php">PHP</label> <br>
        </section>
        <hr>

        <!-- Education Section -->
        <section>
            <h2>Education</h2>
            
            <label for="education">Highest Education Level *</label>
            <select id="education" name="education" required>
                <option value="">Select Education Level</option>
                <option value="SSC">SSC</option>
                <option value="HSC">HSC</option>
                <option value="Diploma">Diploma</option>
                <option value="Bachelor">Bachelor</option>
                <option value="Master">Master</option>
            </select> <br>
        </section>
        <hr>

        <!-- Account Information Section -->
        <section>
            <h2>Account Information</h2>
            
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" 
                   pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}" 
                   minlength="8" 
                   maxlength="50"
                   placeholder="Min 8 chars: uppercase, lowercase, number, special char"
                   title="Password must contain at least 8 characters, including uppercase, lowercase, number, and special character (@$!%*?&)"
                   required> <br>

            <label for="confirmPassword">Confirm Password *</label>
            <input type="password" id="confirmPassword" name="confirmPassword" 
                   pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}" 
                   minlength="8" 
                   maxlength="50"
                   placeholder="Re-enter your password"
                   title="Password must match the above field"
                   required> <br>
        </section>
        <hr>

        <button type="submit">Submit</button> &nbsp;&nbsp;
        <button type="reset">Reset</button>
    </form>
</body>
</html>
